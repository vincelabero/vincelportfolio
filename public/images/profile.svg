<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Portrait placeholder for Marc Vincel A. Abero">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#0f172a"/>
            <stop offset="0.55" stop-color="#071120"/>
            <stop offset="1" stop-color="#020617"/>
        </linearGradient>
        <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#67e8f9"/>
            <stop offset="0.55" stop-color="#22d3ee"/>
            <stop offset="1" stop-color="#34d399"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.42" r="0.55">
            <stop offset="0" stop-color="#22d3ee" stop-opacity="0.34"/>
            <stop offset="0.55" stop-color="#0ea5e9" stop-opacity="0.08"/>
            <stop offset="1" stop-color="#020617" stop-opacity="0"/>
        </radialGradient>
        <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
            <path d="M44 0H0V44" fill="none" stroke="#94a3b8" stroke-opacity="0.09" stroke-width="1"/>
        </pattern>
    </defs>

    <rect width="800" height="800" fill="url(#bg)"/>
    <rect width="800" height="800" fill="url(#grid)"/>

    <circle cx="400" cy="390" r="306" fill="url(#glow)"/>
    <circle cx="400" cy="390" r="252" fill="none" stroke="url(#accent)" stroke-opacity="0.32" stroke-width="2"/>
    <circle cx="400" cy="390" r="286" fill="none" stroke="url(#accent)" stroke-opacity="0.12" stroke-width="1"/>

    <path d="M168 630c46-104 136-162 232-162s186 58 232 162" fill="none" stroke="url(#accent)" stroke-opacity="0.22" stroke-width="2"/>
    <path d="M126 684c62-132 158-204 274-204s212 72 274 204" fill="none" stroke="url(#accent)" stroke-opacity="0.12" stroke-width="1"/>

    <g fill="url(#accent)">
        <circle cx="152" cy="252" r="5" opacity="0.8"/>
        <circle cx="650" cy="318" r="4" opacity="0.6"/>
        <circle cx="620" cy="214" r="3" opacity="0.5"/>
        <circle cx="196" cy="520" r="3" opacity="0.5"/>
    </g>

    <text x="400" y="440" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="164" font-weight="700" letter-spacing="10" fill="url(#accent)">MA</text>
    <text x="400" y="505" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="21" font-weight="600" letter-spacing="13" fill="#94a3b8">PORTFOLIO</text>

    <rect x="270" y="590" width="260" height="42" rx="21" fill="#0f172a" stroke="#22d3ee" stroke-opacity="0.22"/>
    <text x="400" y="617" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="15" font-weight="600" letter-spacing="5" fill="#67e8f9">BSIT • 4TH YEAR</text>
